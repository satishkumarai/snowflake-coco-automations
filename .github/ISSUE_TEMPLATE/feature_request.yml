name: Feature Request
description: Suggest a new automation pattern, SQL query, or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please describe the use case.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What operational problem would this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the automation pattern, SQL, or prompt you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context about the request.
