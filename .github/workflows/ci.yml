name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          files=(
            "README.md"
            "LICENSE"
            "LICENSE-CC-BY-4.0"
            "CODE_OF_CONDUCT.md"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            ".gitignore"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check SQL files are non-empty
        run: |
          find sql -name '*.sql' -empty -exec sh -c 'echo "EMPTY: {}"; exit 1' \;
          echo "All SQL files are non-empty."

      - name: Check prompt files are non-empty
        run: |
          find prompts -name '*.md' -empty -exec sh -c 'echo "EMPTY: {}"; exit 1' \;
          echo "All prompt files are non-empty."

      - name: Validate JSON files
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            python3 -m json.tool "$f" > /dev/null || { echo "INVALID JSON: $f"; exit 1; }
            echo "OK: $f"
          done

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
          fix: false
